version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - out_of_scope
  # Queue
  - join_queue
  - cancel_queue
  - check_queue_status
  - get_queue_number
  - estimated_wait_time
  # Clinic info
  - clinic_hours
  - nearest_clinic
  - get_clinic_location
  - get_clinic_services
  # Appointments
  - appointment_inquiry
  - book_appointment
  - cancel_appointment
  - reschedule_appointment
  - recommendation_request
  - ask_my_appointments      # NEW — "what are my appointments" / "when is my next appointment"
  # Support
  - human_assistance
  - complaint
  # FAQ
  - ask_requirements
  - ask_payment
  - ask_results
  - ask_philhealth
  - ask_hmo
  - general_health_faq

entities:
  - clinic_name
  - service_name
  - location
  - date
  - time
  - payment_method

slots:
  clinic_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: clinic_name
      # Captures the reply RAW, regardless of NLU intent/entity confidence,
      # while join_queue_form is actively asking for it — this is the real
      # fix for a bare reply like "Vertis" or "Hi-Precision - Vertis"
      # falling to nlu_fallback (there were previously zero clinic_name
      # entity training examples at all, so extraction alone could never
      # be relied on). Same pattern appointment_form already uses for
      # date/time below.
      - type: from_text
        conditions:
          - active_loop: join_queue_form
            requested_slot: clinic_name

  service_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: service_name

  location:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: location

  # date/time now do double duty: still fill from an NLU-tagged entity
  # anywhere in the conversation (unchanged), AND fill from plain free text
  # while the appointment_form/reschedule_form is actively asking for them
  # — that second mapping is what lets the booking/reschedule flow collect
  # a real date and time slot from the patient instead of just linking to
  # the app.
  date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: date
      - type: from_text
        conditions:
          - active_loop: appointment_form
            requested_slot: date
          - active_loop: reschedule_form
            requested_slot: date

  time:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: time
      - type: from_text
        conditions:
          - active_loop: appointment_form
            requested_slot: time
          - active_loop: reschedule_form
            requested_slot: time

  # Contextual memory slots
  last_queue_number:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_clinic_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  last_wait_time:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  escalated:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

  # ── NEW: patient identity ──────────────────────────────────────────────
  # Set by action_session_start from the metadata hq-server's
  # chatbotController.handleMessage forwards on every webhook call — the
  # patient's own bearer token, id, and name. Every action that needs to
  # call hq-server as this specific patient (join queue, book, cancel,
  # reschedule, escalate) reads patient_token from here.
  patient_token:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  patient_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  patient_name:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  # ── NEW: appointment booking / reschedule support ──────────────────────
  # Holds the real available time-slot strings for the chosen clinic+date
  # (from GET /appointments/available-slots), so the time the patient types
  # can be matched against what's actually bookable instead of accepted
  # blindly.
  available_slots:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

  pending_appointment_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  pending_queue_entry_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  # Disambiguates a bare "yes"/"no" between confirming a queue cancellation
  # vs an appointment cancellation. Must be `categorical` (not `text`) —
  # a text slot only featurizes as a binary "is this set" flag, so
  # RulePolicy can't actually tell "cancel_queue" apart from
  # "cancel_appointment" even with different values in a rule condition;
  # only categorical/bool slots are one-hot encoded by value, which is
  # what actually lets RulePolicy prove these two states are exclusive.
  pending_confirmation:
    type: categorical
    values:
      - cancel_queue
      - cancel_appointment
    influence_conversation: true
    mappings:
      - type: custom

# ── NEW: appointment booking / reschedule / join-queue forms ───────────────
forms:
  appointment_form:
    required_slots:
      - clinic_name
      - service_name
      - date
      - time
  reschedule_form:
    required_slots:
      - date
      - time
  # NEW — see clinic_name slot's from_text mapping above. Rasa's form
  # mechanics automatically skip asking for a slot that's already filled
  # (e.g. carried over from a prior clinic recommendation), so activating
  # this unconditionally on join_queue is safe — it won't re-ask if
  # last_clinic_id/clinic_name are already known.
  join_queue_form:
    required_slots:
      - clinic_name

responses:
  utter_greet:
    - text: "Hi! I'm HQ Assistant. I can help you join a queue, check wait times, find the nearest clinic, book appointments, and more. What do you need today?"
    - text: "Hello! Welcome to HealthQueue+. How can I assist you? You can ask me about queue status, clinic hours, appointments, or get a clinic recommendation."

  utter_goodbye:
    - text: "Take care! Feel free to come back anytime. Stay healthy!"
    - text: "Goodbye! Hope I was able to help. See you next time."

  utter_bot_challenge:
    - text: "I'm HQ Assistant — an AI chatbot for HealthQueue+. I'm here to help with your clinic needs. For urgent concerns, just say 'talk to staff' and I'll escalate to a human."

  utter_default:
    - text: "I'm not sure I understood that. I can help with: queue status, wait times, clinic recommendations, appointments, hours, or services. What do you need?"
    - text: "Sorry, I didn't catch that! Try asking about your queue, appointment, clinic hours, or say 'recommend a clinic' to find the best option near you."

  utter_out_of_scope:
    - text: "That's outside my area — I'm specialized in HealthQueue+ clinic services. For medical advice, please consult a doctor. Can I help with anything clinic-related?"

  # ── Queue ──────────────────────────────────────────────────────────────────
  utter_get_queue_number:
    - text: "To get a queue number, tap **Get Queue Number** on your dashboard, select the clinic and service, and you'll be assigned a number instantly. Would you like me to check which clinic has the shortest wait?"

  utter_queue_cancelled_confirmed:
    - text: "Your queue entry has been cancelled. You can rejoin anytime by tapping 'Get Queue Number'."

  utter_queue_cancel_aborted:
    - text: "No problem — your queue spot is still active. Let me know if there's anything else I can help with."

  # ── Appointments ───────────────────────────────────────────────────────────
  utter_appointment_inquiry:
    - text: "HealthQueue+ supports both walk-in queue and pre-booked appointments. Walk-ins get a queue number on arrival; appointments reserve a specific time slot. Appointments are recommended for busy hours or specific services. Want to book one?"

  # utter_book_appointment / utter_cancel_appointment / utter_reschedule_appointment
  # kept below purely as fallback informational text — book_appointment/
  # cancel_appointment/reschedule_appointment intents are now ACTUALLY
  # wired (see rules.yml) to appointment_form / action_cancel_appointment /
  # action_reschedule_appointment, which was previously only claimed here,
  # not actually done in rules.yml.
  utter_book_appointment:
    - text: "To book an appointment, tap **Book Appointment** on your dashboard → select clinic, service, date, and time slot → confirm. You'll get a notification once booked. Shall I check available slots for you?"
    - text: "You can book directly in the app! Dashboard → Book Appointment → pick your preferred clinic and schedule. Need help choosing a clinic?"

  utter_cancel_appointment:
   - text: "To cancel, go to **My Appointments**, select the appointment, and tap **Cancel**. Note: cancellations must be made at least 1 hour before the scheduled time. Need help with anything else?"

  utter_reschedule_appointment:
    - text: "To reschedule, go to **My Appointments**, select your appointment, and choose a new date and time — subject to availability. Would you like me to check available slots?"

  # ── Clinic Info ────────────────────────────────────────────────────────────
  utter_get_clinic_location:
    - text: "You can find all nearby clinic locations on the **Map** in your app. Tap any clinic pin for its address and directions. Want me to recommend the closest one with the shortest queue?"

  utter_ask_requirements:
    - text: "Most tests require a valid ID. Fasting (8–12 hours) is needed for blood sugar and lipid tests. Some procedures need a doctor's request. Which test are you preparing for? I can give specific requirements."

  utter_ask_payment:
    - text: "Accepted payments: **Cash, GCash, Maya, and major credit/debit cards**. PhilHealth and most major HMOs are also accepted. Payment is made at the clinic. Need more details on coverage?"

  utter_ask_results:
    - text: "Most results are available **same day**. Specialized tests may take 1–3 business days. The release time is printed on your receipt. Some branches offer email/digital delivery. Want to check with a specific branch?"

  utter_ask_philhealth:
    - text: "Yes, PhilHealth is accepted! Bring your **PhilHealth ID and MDR** (Member Data Record). Coverage depends on your benefit package and test type. Call your branch to confirm specific coverage."

  utter_ask_hmo:
    - text: "Accepted HMOs include **Maxicare, Medicard, InLife Health, Intellicare, and Philcare**. Bring your HMO card and Letter of Authorization (LOA). Check with your HMO for covered tests."

  utter_general_health_faq:
    - text: "For specific health questions, I recommend consulting a licensed physician. I can help with clinic-related questions: services, schedules, queues, and appointments. What else can I help with?"

  utter_clarification_prompt:
    - text: "Sure! Here's what I can help with: checking your queue, joining a queue, finding clinics, booking appointments, or checking clinic hours. Which one do you need?"

  # Shown when a form (appointment_form / join_queue_form / reschedule_form)
  # gets cancelled mid-way — either explicitly (deny/"never mind") or
  # because the patient asked for something else entirely. See rules.yml's
  # interruption-handling rules for where this is actually used.
  utter_form_cancelled:
    - text: "No problem, I've cancelled that. What would you like to do instead?"
    - text: "Okay, never mind that then! Anything else I can help with?"

  utter_escalation_sent:
    - text: "I've flagged your concern to our staff. A healthcare team member will review it shortly. You can also call your branch directly for urgent matters. Is there anything else I can note for them?"

  utter_iamabot:
    - text: "I'm HQ Assistant, the AI chatbot for HealthQueue+. I can escalate to a human staff member if needed — just say 'talk to staff'!"

  # ── NEW: appointment_form / join_queue_form prompts ─────────────────────
  # date/time are asked dynamically instead (action_ask_date shows nothing
  # special, but action_ask_time shows the REAL available slots for the
  # date just given — see actions.py). clinic_name/service_name stay static.
  # utter_ask_clinic_name is appointment_form's prompt. join_queue_form
  # gets its own utter_ask_join_queue_form_clinic_name (Rasa's
  # form-specific override naming: utter_ask_<form>_<slot>) — reusing the
  # same generic prompt for both meant the bot said "book at" while you
  # were trying to join a queue, which read as if it had misunderstood
  # what you were doing.
  utter_ask_clinic_name:
    - text: "Which branch would you like to book at?"
  utter_ask_join_queue_form_clinic_name:
    - text: "Which branch would you like to queue at?"
  utter_ask_service_name:
    - text: "What service or test is this for?"
  utter_ask_date:
    - text: "What date works for you? (e.g. \"tomorrow\", \"next Monday\", \"Sept 10\")"

actions:
  - action_get_estimated_wait_time
  - action_check_queue_status
  - action_join_queue
  - action_cancel_queue
  - action_get_clinic_recommendations
  - action_get_clinic_hours
  - action_get_clinic_services
  - action_escalate_to_staff
  # action_get_available_slots intentionally NOT listed — no Python class
  # implements it anymore. Its logic now lives inside
  # validate_appointment_form (checks real availability the moment a date
  # is given), so keeping it here would be a dangling action reference.
  - action_default_fallback
  # ── NEW ──────────────────────────────────────────────────────────────────
  - action_session_start
  - action_confirm_cancel_queue
  - action_get_my_appointments
  - action_cancel_appointment
  - action_confirm_cancel_appointment
  - action_clear_pending_confirmation
  - action_reschedule_appointment
  - action_confirm_reschedule
  - action_submit_appointment_form
  - action_ask_time
  - validate_appointment_form
  - validate_reschedule_form
  - validate_join_queue_form

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
