version: "3.1"

rules:

- rule: Greet
  steps:
    - intent: greet
    - action: utter_greet

- rule: Goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Bot challenge
  steps:
    - intent: bot_challenge
    - action: utter_bot_challenge

- rule: Out of scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: Fallback to default
  steps:
    - intent: nlu_fallback
    - action: utter_default

# ── Queue ──────────────────────────────────────────────────────────────────
# Was a direct `action: action_join_queue` — that action used to have to
# ask "which branch?" itself with no way to reliably capture the reply
# (zero clinic_name NLU training data existed, and there was no active
# form to capture free text regardless of NLU confidence). Routing through
# join_queue_form first means a bare reply like "Vertis" is captured as
# raw text while the form is active — see the clinic_name slot's
# from_text mapping in domain.yml. The form auto-skips asking if
# clinic_name/last_clinic_id is already known (e.g. from a prior
# recommendation), so this doesn't add an extra step in that case.
- rule: Activate join queue form
  steps:
    - intent: join_queue
    - action: join_queue_form
    - active_loop: join_queue_form

- rule: Submit join queue form
  condition:
    - active_loop: join_queue_form
  steps:
    - action: join_queue_form
    - active_loop: null
    - action: action_join_queue

# "Interruption" handling for forms in general — without this, ANY
# message sent while a form is active gets treated as an attempt to fill
# the slot it's currently asking for (that's just how Rasa forms work by
# default). The rules below handle switching tasks or backing out
# entirely; see the note further down for why a recommendation-request
# interruption specifically was deliberately NOT included.
# Recommend-while-form-active interruption rules were removed here —
# they were the actual cause of the "Hi-Precision - Vertis" failure in
# the reported conversation. Those rules fired purely off classified
# intent, with no check for whether the message might actually BE a
# valid clinic name being typed in response to "which branch?" — so a
# misclassification (recommendation_request scored higher than it
# should have for a clinic name) hijacked the message before from_text
# ever got a chance to capture it as the clinic name it actually was.
# Reliably capturing a typed clinic name is the core, expected happy
# path for these forms; asking for a recommendation mid-form is a much
# rarer edge case not worth risking that over. If you want this back,
# it needs the interruption rule paired with a check that the message
# doesn't already look like a clinic name — not just a bare intent match.
# ── Broader interruption handling ───────────────────────────────────────
# The gap that caused this: once ANY form is active, Rasa treats every
# message as an attempt to fill the slot it's currently asking for (via
# clinic_name's from_text mapping) — UNLESS a rule explicitly says
# otherwise. Only recommendation_request had that above. Every other
# intent — wanting to queue instead of book, checking status, asking for
# staff, or just backing out — was getting swallowed as a failed
# "I couldn't find a branch called ..." clinic-name lookup instead of
# being recognized as the patient wanting something else. This is what
# made the whole thing feel broken/unconversational rather than just
# incomplete on one specific case.
#
# action_deactivate_loop is a Rasa BUILT-IN default action — no new
# Python code needed — it cleanly exits whichever form is active before
# the interruption's own action runs.

# -- appointment_form --
- rule: Cancel appointment form
  condition:
    - active_loop: appointment_form
  steps:
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_form_cancelled

- rule: Switch to join queue while appointment form active
  condition:
    - active_loop: appointment_form
  steps:
    - intent: join_queue
    - action: action_deactivate_loop
    - active_loop: null
    - action: join_queue_form
    - active_loop: join_queue_form

- rule: Check queue status while appointment form active
  condition:
    - active_loop: appointment_form
  steps:
    - intent: check_queue_status
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_check_queue_status

- rule: Human assistance while appointment form active
  condition:
    - active_loop: appointment_form
  steps:
    - intent: human_assistance
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_escalate_to_staff

# -- join_queue_form --
- rule: Cancel join queue form
  condition:
    - active_loop: join_queue_form
  steps:
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_form_cancelled

- rule: Switch to book appointment while join queue form active
  condition:
    - active_loop: join_queue_form
  steps:
    - intent: book_appointment
    - action: action_deactivate_loop
    - active_loop: null
    - action: appointment_form
    - active_loop: appointment_form

- rule: Check queue status while join queue form active
  condition:
    - active_loop: join_queue_form
  steps:
    - intent: check_queue_status
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_check_queue_status

- rule: Human assistance while join queue form active
  condition:
    - active_loop: join_queue_form
  steps:
    - intent: human_assistance
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_escalate_to_staff

# -- reschedule_form --
- rule: Cancel reschedule form
  condition:
    - active_loop: reschedule_form
  steps:
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_form_cancelled

- rule: Check queue status while reschedule form active
  condition:
    - active_loop: reschedule_form
  steps:
    - intent: check_queue_status
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_check_queue_status

- rule: Human assistance while reschedule form active
  condition:
    - active_loop: reschedule_form
  steps:
    - intent: human_assistance
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_escalate_to_staff

- rule: Cancel queue
  steps:
    - intent: cancel_queue
    - action: action_cancel_queue

# ActionCancelQueue asks "Cancel and lose your spot? (yes/no)" and sets
# pending_confirmation: cancel_queue — these two rules were completely
# missing before, so a "yes" here had no rule to fire
# action_confirm_cancel_queue at all. The condition on pending_confirmation
# is what lets RulePolicy tell this apart from confirming an appointment
# cancellation below without the two rules contradicting each other (see
# the comment on that slot in domain.yml for why it has to be categorical).
- rule: Confirm cancel queue
  condition:
    - slot_was_set:
        - pending_confirmation: cancel_queue
  steps:
    - intent: affirm
    - action: action_confirm_cancel_queue

- rule: Deny cancel queue
  condition:
    - slot_was_set:
        - pending_confirmation: cancel_queue
  steps:
    - intent: deny
    - action: action_clear_pending_confirmation

- rule: Check queue status
  steps:
    - intent: check_queue_status
    - action: action_check_queue_status

- rule: Get queue number
  steps:
    - intent: get_queue_number
    - action: utter_get_queue_number

- rule: Get wait time
  steps:
    - intent: estimated_wait_time
    - action: action_get_estimated_wait_time

# ── Clinic info ───────────────────────────────────────────────────────────
- rule: Clinic hours
  steps:
    - intent: clinic_hours
    - action: action_get_clinic_hours

- rule: Clinic location
  steps:
    - intent: get_clinic_location
    - action: utter_get_clinic_location

- rule: Nearest clinic
  steps:
    - intent: nearest_clinic
    - action: action_get_clinic_recommendations

- rule: Clinic services
  steps:
    - intent: get_clinic_services
    - action: action_get_clinic_services

- rule: Clinic recommendation
  steps:
    - intent: recommendation_request
    - action: action_get_clinic_recommendations

# ── Appointments ──────────────────────────────────────────────────────────
- rule: Appointment inquiry
  steps:
    - intent: appointment_inquiry
    - action: utter_appointment_inquiry

# Was wired to the static utter_book_appointment ("tap Book Appointment in
# the dashboard") — appointment_form and all its validation/submit logic
# (ValidateAppointmentForm, action_submit_appointment_form, action_ask_time)
# already existed in actions.py but nothing here ever activated the form,
# so none of that code could ever run.
- rule: Activate appointment form
  steps:
    - intent: book_appointment
    - action: appointment_form
    - active_loop: appointment_form

- rule: Submit appointment form
  condition:
    - active_loop: appointment_form
  steps:
    - action: appointment_form
    - active_loop: null
    - action: action_submit_appointment_form

# Was wired to the static utter_cancel_appointment ("go to My Appointments
# and tap Cancel") — action_cancel_appointment (which actually looks up
# and cancels it) already existed, just never referenced here.
- rule: Cancel appointment
  steps:
    - intent: cancel_appointment
    - action: action_cancel_appointment

- rule: Confirm cancel appointment
  condition:
    - slot_was_set:
        - pending_confirmation: cancel_appointment
  steps:
    - intent: affirm
    - action: action_confirm_cancel_appointment

- rule: Deny cancel appointment
  condition:
    - slot_was_set:
        - pending_confirmation: cancel_appointment
  steps:
    - intent: deny
    - action: action_clear_pending_confirmation

# Was wired to the static utter_reschedule_appointment — same issue as
# cancel/book above. action_reschedule_appointment picks the appointment
# and resets date/time to null, THEN reschedule_form asks for the new
# date/time (its own from_text mapping handles that free-text capture,
# same pattern as appointment_form), and action_confirm_reschedule
# actually submits the change.
- rule: Start reschedule appointment
  steps:
    - intent: reschedule_appointment
    - action: action_reschedule_appointment
    - action: reschedule_form
    - active_loop: reschedule_form

- rule: Submit reschedule form
  condition:
    - active_loop: reschedule_form
  steps:
    - action: reschedule_form
    - active_loop: null
    - action: action_confirm_reschedule

# Was entirely missing — action_get_my_appointments already existed with
# no rule ever calling it.
- rule: My appointments
  steps:
    - intent: ask_my_appointments
    - action: action_get_my_appointments

# ── Support ───────────────────────────────────────────────────────────────
- rule: Human assistance
  steps:
    - intent: human_assistance
    - action: action_escalate_to_staff

- rule: Complaint
  steps:
    - intent: complaint
    - action: action_escalate_to_staff

