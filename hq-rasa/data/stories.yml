version: "3.1"

stories:

# ── Queue Enrollment Flow ────────────────────────────────────────────────────
# join_queue now goes through join_queue_form (see rules.yml) instead of
# calling action_join_queue directly — these stories are updated to match,
# since training TED policy on the old direct-call pattern while rules.yml
# enforces the form pattern would teach two contradictory shapes for the
# same intent.
- story: queue enrollment - greet then join
  steps:
    - intent: greet
    - action: utter_greet
    - intent: join_queue
    - action: join_queue_form
    - active_loop: join_queue_form
    - active_loop: null
    - action: action_join_queue

- story: queue enrollment - confirm join
  steps:
    - intent: join_queue
    - action: join_queue_form
    - active_loop: join_queue_form
    - active_loop: null
    - action: action_join_queue
    - intent: check_queue_status
    - action: action_check_queue_status

- story: queue enrollment with wait time
  steps:
    - intent: join_queue
    - action: join_queue_form
    - active_loop: join_queue_form
    - active_loop: null
    - action: action_join_queue
    - intent: estimated_wait_time
    - action: action_get_estimated_wait_time

# Was `affirm -> utter_queue_cancelled_confirmed` directly — action_cancel_queue
# sets pending_confirmation: cancel_queue and rules.yml's "Confirm cancel
# queue" rule (condition on that slot) is what actually fires
# action_confirm_cancel_queue now; going straight to the utterance skipped
# the real cancellation call to hq-server entirely.
- story: cancel queue with confirmation
  steps:
    - intent: cancel_queue
    - action: action_cancel_queue
    - slot_was_set:
        - pending_confirmation: cancel_queue
    - intent: affirm
    - action: action_confirm_cancel_queue

- story: cancel queue denied
  steps:
    - intent: cancel_queue
    - action: action_cancel_queue
    - slot_was_set:
        - pending_confirmation: cancel_queue
    - intent: deny
    - action: action_clear_pending_confirmation

# ── Queue Status Flow ─────────────────────────────────────────────────────────
- story: check queue then wait time
  steps:
    - intent: check_queue_status
