# ── Appointment Flow ──────────────────────────────────────────────────────────
# book_appointment now goes through appointment_form (see rules.yml) instead
# of utter_book_appointment — same reasoning as join_queue above.
# action_get_available_slots (used in the old version of this story) no
# longer exists as a Python action at all; that logic now lives inside
# validate_appointment_form, which runs automatically as part of the form.
- story: book appointment with slot check
